<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANIMUS | ACCESS POINT</title>
    <style>
        body { 
            background-color: #e0e0e0; 
            color: #333; 
            font-family: "Segoe UI", Tahoma, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        #animus-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), url('https://www.transparenttextures.com/patterns/cubes.png');
            z-index: -1;
            opacity: 0.5;
        }
        #login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-left: 5px solid #000;
            box-shadow: 10px 10px 0px #ccc;
            width: 450px;
            text-align: left;
        }
        h1 { font-weight: 300; letter-spacing: 5px; margin-bottom: 30px; border-bottom: 1px solid #ccc; }
        input {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid #000;
            font-size: 16px;
            outline: none;
            text-transform: lowercase;
        }
        .label { font-size: 10px; color: #888; letter-spacing: 2px; }
        #message { margin-top: 20px; font-size: 12px; color: #d9534f; min-height: 20px; }
        .hidden { display: none; }
        
        /* Simple reveal animation */
        #secretContent {
            animation: fadeIn 2s;
            text-align: center;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="animus-bg"></div>

<div id="login-box">
    <h1>ANIMUS <small style="font-size: 12px;">v1.0.2</small></h1>
    <div id="entry-ui">
        <div class="label">IDENTITY VERIFICATION REQUIRED</div>
        <p style="font-size: 14px; color: #555;">Enter the Maxim of the Creed to synchronize:</p>
        <input type="text" id="passwordField" placeholder="type here..." autofocus autocomplete="off">
        <div id="message"></div>
    </div>

    <div id="secretContent" class="hidden">
        <h2 style="color: #000; letter-spacing: 2px;">SYNCHRONIZATION COMPLETE</h2>
        <p>Welcome, Brother. The community awaits.</p>
        <hr>
        <p><a href="https://assassinscreed.fandom.com/wiki/Assassin%27s_Creed_(series)" style="color: #888; text-decoration: none; font-weight: bold;">[ ENTER PRIVATE FORUM ]</a></p>
    </div>
</div>

<script>
    const input = document.getElementById('passwordField');
    const msg = document.getElementById('message');
    // The exact secret word you requested
    const secretWord = "nothing is true every thing is permitted";

    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            // Check for match (ignoring extra spaces or caps)
            if (input.value.trim().toLowerCase() === secretWord) {
                document.getElementById('entry-ui').classList.add('hidden');
                document.getElementById('secretContent').classList.remove('hidden');
                msg.innerText = "";
            } else {
                msg.innerText = "DESYNCHRONIZATION DETECTED. TRY AGAIN.";
                input.value = "";
            }
        }
    });
</script>

</body>
</html>
