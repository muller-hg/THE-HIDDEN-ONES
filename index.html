<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA SEQUENCE VERIFICATION</title>
    <style>
        body, html {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', 'Courier New', monospace;
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Full-screen Desync Overlay */
        #desync-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(139, 0, 0, 0.95);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: clamp(2rem, 10vw, 5rem);
            font-weight: 900;
            letter-spacing: 15px;
            z-index: 9999;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,0,0,0.7);
        }

        .active-desync {
            display: flex !important;
            animation: glitcheffect 0.1s infinite;
        }

        @keyframes glitcheffect {
            0% { transform: skew(2deg); opacity: 1; }
            20% { transform: skew(-3deg); opacity: 0.8; }
            40% { transform: skew(5deg); }
            60% { transform: skew(-1deg); opacity: 1; }
            80% { transform: skew(4deg); }
            100% { transform: skew(0deg); }
        }

        .portal-box {
            position: relative;
            text-align: center;
            padding: 60px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #222;
            width: 450px;
            z-index: 10;
        }

        .insignia {
            width: 80px; height: 110px;
            margin: 0 auto 40px;
            background-color: #fff;
            clip-path: polygon(50% 0%, 100% 100%, 85% 100%, 50% 35%, 15% 100%, 0% 100%);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        h1 {
            font-size: 0.9rem;
            letter-spacing: 6px;
            color: #666;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            color: #fff;
            width: 100%;
            padding: 10px;
            text-align: center;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            text-transform: lowercase;
        }

        input:focus { border-color: #fff; }

        .status-text {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="desync-screen">DESYNCHRONIZED</div>

<div class="portal-box" id="main-box">
    <div class="insignia"></div>
    <h1>Genetic Memory Locked</h1>
    
    <input type="text" id="passInput" placeholder="Enter Credentials..." autocomplete="off">
    
    <div id="msg" class="status-text">WAITING FOR INPUT...</div>
</div>

<script>
    const input = document.getElementById('passInput');
    const desyncScreen = document.getElementById('desync-screen');
    const msg = document.getElementById('msg');

    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const val = input.value.toLowerCase().trim();
            
            // The Secret Phrase
            if (val === "nothing is true everything is permitted") {
                msg.innerHTML = "ACCESS GRANTED. REDIRECTING...";
                msg.style.color = "#00ffcc";
                setTimeout(() => {
                    window.location.href = "https://assassinscreed.fandom.com/wiki/Assassin%27s_Creed_(series)";
                }, 1500);
            } else {
                // Full Screen Failure
                desyncScreen.classList.add('active-desync');
                
                setTimeout(() => {
                    desyncScreen.classList.remove('active-desync');
                    input.value = "";
                    input.focus();
                }, 1200);
            }
        }
    });
</script>

</body>
</html>
