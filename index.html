<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMUS TERMINAL | THE HIDDEN ONES</title>
    <link rel="icon" type="image/x-icon" href="https://www.google.com/s2/favicons?domain=assassinscreed.fandom.com">
    <style>
        body, html {
            background-color: #050505; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%; margin: 0; display: flex;
            justify-content: center; align-items: center; overflow: hidden;
            animation: backgroundPulse 12s infinite alternate;
        }
        @keyframes backgroundPulse { 0% { background-color: #050505; } 100% { background-color: #0b1116; } }
        
        /* FULL SCREEN OVERLAYS */
        #desync-screen, #sync-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center;
            font-weight: 900; z-index: 9999; text-transform: uppercase;
            text-align: center; padding: 20px; box-sizing: border-box;
        }

        /* FAIL SCREEN (RED) */
        #desync-screen { background-color: rgba(150, 0, 0, 0.98); color: white; font-size: clamp(2rem, 8vw, 5rem); letter-spacing: 15px; }
        
        /* SUCCESS SCREEN (ANIMUS BLUE/GREEN) */
        #sync-screen { 
            background-color: rgba(0, 40, 45, 0.98); 
            color: #00ffcc; 
            font-size: clamp(1.5rem, 5vw, 3.5rem); 
            letter-spacing: 8px;
            line-height: 1.2;
        }

        .active-overlay { display: flex !important; animation: glitcheffect 0.1s infinite; }
        @keyframes glitcheffect { 0% { transform: translate(2px, 1px); } 50% { transform: translate(-2px, -1px); filter: blur(1px); } 100% { transform: translate(0); } }

        /* PORTAL UI */
        .portal-box {
            position: relative; text-align: center; padding: 50px;
            background: rgba(10, 10, 10, 0.85); border: 1px solid #333;
            width: 400px; z-index: 50; box-shadow: 0 0 30px rgba(0,0,0,1);
            backdrop-filter: blur(8px);
        }
        .insignia {
            width: 80px; height: 110px; margin: 0 auto 30px;
            background-color: #ffffff; clip-path: polygon(50% 0%, 100% 100%, 85% 100%, 50% 35%, 15% 100%, 0% 100%);
            animation: pulse-glow 4s infinite ease-in-out;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); transform: scale(1); } 50% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); transform: scale(1.03); } }
        
        input {
            background: #111; border: none; border-bottom: 2px solid #444;
            color: #fff; width: 100%; padding: 12px; text-align: center;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        
        #youtube-player { position: absolute; top: -9999px; left: -9999px; visibility: hidden; }
    </style>
</head>
<body onclick="playMusic()">

    <div id="desync-screen">DESYNCHRONIZED</div>
    
    <div id="sync-screen">
        SYNCHRONIZING:<br>THE TRUTH OF THE FIRST CIVILIZATION
    </div>

    <iframe id="youtube-player" width="100" height="100" 
        src="https://www.youtube.com/embed/FSVHx23ByhM?enablejsapi=1&loop=1&playlist=FSVHx23ByhM" 
        frameborder="0" allow="autoplay">
    </iframe>

    <div class="portal-box">
        <div class="insignia"></div>
        <h1 style="font-size: 0.8rem; letter-spacing: 5px; color: #888; margin-bottom: 30px; text-transform: uppercase;">Genetic Memory Locked</h1>
        <input type="text" id="passInput" placeholder="[ CLICK TO INITIALIZE ]" autocomplete="off">
        <div id="msg" style="margin-top: 20px; font-size: 0.7rem; color: #555; letter-spacing: 2px;">SYSTEM STANDBY...</div>
    </div>

    <script>
        const input = document.getElementById('passInput');
        const desyncScreen = document.getElementById('desync-screen');
        const syncScreen = document.getElementById('sync-screen');
        const msg = document.getElementById('msg');
        
        let audioCtx = null;
        let musicStarted = false;

        function playMusic() {
            if (!musicStarted) {
                const player = document.getElementById('youtube-player');
                player.src += "&autoplay=1";
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                musicStarted = true;
                input.placeholder = "Enter Credentials...";
            }
        }

        function playSynthSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const val = input.value.toLowerCase().trim();
                if (val === "nothing is true everything is permitted") {
                    playSynthSound('success');
                    
                    // Show Huge Success Screen
                    syncScreen.classList.add('active-overlay');
                    
                    setTimeout(() => { 
                        window.location.href = "https://assassinscreed.fandom.com/wiki/The_Truth"; 
                    }, 5000);
                } else {
                    playSynthSound('fail');
                    desyncScreen.classList.add('active-overlay');
                    setTimeout(() => {
                        desyncScreen.classList.remove('active-overlay');
                        input.value = "";
                        input.focus();
                    }, 1200);
                }
            }
        });
    </script>
</body>
</html>
